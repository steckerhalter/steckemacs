name: Emacs CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Emacs
      uses: purcell/setup-emacs@master
      with:
        version: 30.1  # You can use 'latest' or a specific version like '30.1'

    - name: Verify syntax and load configuration
      run: |
        emacs --batch \
          --eval "(setq load-prefer-newer t)" \
          -l steckemacs.el
